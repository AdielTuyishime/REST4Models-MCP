<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DT-Model</title>

  <!-- Fonts and Libraries -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4/lodash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/backbone@1/backbone-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jointjs/dist/joint.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jointjs/dist/joint.min.css" />
  
  <!-- CodeMirror JSON support -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
	  

  <!-- Styles -->
  <style>
    /* Global layout */
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #f9f9f9;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      background: #163250;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo img {
      height: 78px;
    }

    .top-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      margin-left: 30px;
    }

    .top-nav a:hover {
      text-decoration: underline;
    }

    #container {
      display: flex;
      height: calc(100vh - 60px);
      padding-top: 50px;
    }

    #sidebar {
      width: 300px;
      border-right: 1px solid #ccc;
      padding: 1rem;
      overflow-y: auto;
      background: #f5f1f0;
    }

    #graph {
      flex: 1;
      height: 100%;
    }

    .class-item {
      margin: 0.5rem 0;
      cursor: pointer;
      color: white;
    }

    .class-item:hover {
      text-decoration: underline;
    }

    .form-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .load-btn {
      padding: 0.5rem 1rem;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .load-btn:hover {
      background-color: #005599;
    }

    /* Modal base style */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-top: 0;
    }

    .modal-content input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
    }

    .modal-content button {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
    }
    
    /* Customer Context Menu */
   #contextMenu div:hover {
    background-color: #f0f0f0;
	}
	
	/* Class for highlight */
	.selected-class {
    stroke: #ff6600 !important;
    stroke-width: 3 !important;
	}
	
   .checkbox-group {
	  display: flex;
	  flex-direction: column;
	  gap: 0.5rem;
	  margin-top: 0.5rem;
	}

	.checkbox-row {
	  display: flex;
	  grid-template-columns: 120px 1fr; /* 120px label column, then checkbox */
	  align-items: center;
	}

	.checkbox-row label {
	  justify-self: start;
	}

	.checkbox-row input[type="checkbox"] {
	  justify-self: start;
	}	    
	
	/**
	*Model Summary
	*/
	#summaryPanel {
    background-color: #111;
    color: white;
    padding: 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-size: 1rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
	}

	#summaryPanel div {
	    display: flex;
	    justify-content: space-between;
	    margin-bottom: 0.5rem;
	}
	
	#summaryPanel span {
	    font-weight: 600;
	}
	
	#summaryPanel strong {
	    font-weight: bold;
	}
	
	/**
	*Model Summary
	*/
	#classList {
    background-color: #111;
    color: white;
    padding: 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-size: 1rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
	}

	#classList div {
	    display: flex;
	    justify-content: space-between;
	    margin-bottom: 0.5rem;
	}
	
	#classList span {
	    font-weight: 600;
	}
	
	#classList strong {
	    font-weight: bold;
	}
	
	select#packageSelect {
	  width: 100%;
	  padding: 0.5rem;
	  border-radius: 6px;
	  border: 1px solid #ccc;
	  font-size: 1rem;
	  background-color: #fff;
	  color: #333;
	  font-family: 'Inter', sans-serif;
	  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
	  transition: border-color 0.2s, box-shadow 0.2s;
	}

	select#packageSelect:focus {
	  border-color: #005599;
	  outline: none;
	  box-shadow: 0 0 0 2px rgba(0,85,153,0.2);
	}
	
  	select {
	  font-size: 1rem;
	  border: 1px solid #ccc;
	  border-radius: 6px;
	  padding: 0.5rem;
	}
	
	#jsonInstancePanel {
  background: #f4f4f4;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 1rem;
  margin-top: 1rem;
}
	

#jsonEditor {
  border: 1px solid #ccc;
  height: 400px;
  width: 100%;
}

#instancePanel {
  position: fixed;
  right: 0;
  width: 400px;
  height: calc(100vh - 60px);
  background-color: #ffffff;
  border-left: 1px solid #ccc;
  box-shadow: -2px 0 5px rgba(0,0,0,0.1);
  padding: 1rem;
  overflow-y: auto;
  z-index: 1000;
  font-family: 'Inter', sans-serif;
}

#instancePanel h3 {
  margin-top: 0;
  font-size: 1.2rem;
  color: #003366;
}

#instanceList {
  font-family: monospace;
  font-size: 0.9rem;
  white-space: pre-wrap;
  background: #f9f9f9;
  padding: 0.5rem;
  border-radius: 4px;
  border: 1px solid #ddd;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
}
		
  </style>
</head>

<body>
  <!-- Header bar -->
  <header>
    <div class="logo">
      <img src="/logo.png" alt="Logo">
    </div>
    <nav class="top-nav">
      <a href="/">Home</a>
    </nav>
  </header>

  <!-- Main app container -->
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
    
    <!-- New package Creation Modal -->    
      <h3>Load a Metamodel</h3>
	  <div class="form-group">
	  <select id="packageSelect">
	    <option value="">Select a package...</option>
	  </select>
	  <button class="load-btn" onclick="loadPackage()">Load</button>
	  </div>
      

      <h3>Classes</h3>
      <div id="classList">Loading...</div>
      
  	<!-- JSON Instance Panel (moved here) -->
	  <div id="jsonInstancePanel" style="display:none;">
	    <h3>Instantiate: <span id="jsonTargetClass"></span></h3>
	    <textarea id="jsonInstanceInput" rows="10" style="display:none;"></textarea> 
	    <div id="jsonEditor" style="border:1px solid #ccc; height:300px; width:100%;"></div>
	    <input type="text" id="jsonModelFile" placeholder="Model file name (optional)" style="width:90%; margin-top:0.5rem;" />
	    <div style="margin-top:0.5rem;">
	      <button class="load-btn" onclick="submitJsonInstance()">Submit</button>
	      <button class="load-btn" onclick="document.getElementById('jsonInstancePanel').style.display='none'">Cancel</button>
	    </div>
	  </div>
      
      
      
      
    </div>
      
   <div id="instancePanel">
  <h3>Instances of <span id="instancePanelTitle">Class</span></h3>
  <textarea id="instanceList" readonly></textarea>
  
</div>
     
		
    <!-- Canvas for diagram -->
    <div id="graph"></div>
  </div>

<script>


window.onload = () => {
	// Drop down of a List of packages
	populatePackageDropdown();

	let instanceEditor;
	// Initialize CodeMirror for the instance panel
	  instanceEditor = CodeMirror.fromTextArea(document.getElementById("instanceList"), {
	    mode: { name: "javascript", json: true },
	    lineNumbers: true,
	    readOnly: true,
	    theme: "material", // You can use another theme if preferred
	    tabSize: 2,
	    viewportMargin: Infinity
	  });
	  instanceEditor.setSize("100%", "800px"); // 👈 sets width x height
	
 	// Now all your other logic: graph, paper, drawGraph(), etc.
    // Initialize JointJS Graph and Paper
    const graph = new joint.dia.Graph();
    const paper = new joint.dia.Paper({
        el: document.getElementById('graph'),
        model: graph,
        width: '100%',
        height: '100%',
        gridSize: 10,
        drawGrid: true
    });
    
    let currentSelectedClass = null;
    let selectedSourceClass = null;
    let selectedTargetClass = null;
    let isRelationshipMode = false;
    
    
   
    /**
     * Fetch all classes in a package from the backend.
     */
    async function fetchClasses(packageName) {
        const res = await fetch(`/api/v1/metamodels/${packageName}/structure`);
        return await res.json();
    }

    /**
     * Render class list on sidebar
     */
    function renderClassList(classes) {
        const container = document.getElementById("classList");
        container.innerHTML = "";
        classes.forEach(cls => {
            const div = document.createElement("div");
            div.classList.add("class-item");
            div.textContent = cls.className;
            //div.onclick = () => drawGraph(classes);
            div.onclick = () => {
    		currentSelectedClass = cls.className;
    		highlightElementOnCanvas(cls.className);
    		openJsonInstancePanel(cls); // 👈 pass whole object
    		showInstancesForClass(cls.className); // Fetch and display instance data
			};

            container.appendChild(div);
        });
    }

    
    /**
     * Draw class diagram with layout and associations
     */
    function drawGraph(classes) {
        graph.clear();
        const uml = joint.shapes.uml;
        const classMap = {};

        const spacingX = 300;
        const spacingY = 200;
        let row = 0;
        let col = 0;

        // Draw classes
        classes.forEach((cls, i) => {
            const classBox = new uml.Class({
                position: {
                    x: col * spacingX + 50,
                    y: row * spacingY + 50
                },
                size: { width: 200, height: 120 },
                name: cls.className,
                attributes: cls.attributes?.map(attr => `${attr.name}: ${attr.type}`) || [],
                methods: [],
                attrs: {
                    '.uml-class-name-rect': {
                        fill: '#003366',
                        stroke: '#000',
                        'stroke-width': 1
                    },
                    '.uml-class-name-text': {
                        fill: '#fff',
                        'font-weight': 'bold',
                        'font-size': 14,
                        'ref-y': 0.5,
                        'y-alignment': 'middle'
                    },
                    '.uml-class-attrs-rect': {
                        fill: '#2c7bbf',
                        stroke: '#000',
                        'stroke-width': 1
                    },
                    '.uml-class-attrs-text': {
                        fill: '#eee',
                        'font-size': 12
                    },
                    '.uml-class-methods-rect': {
                        fill: '#005f99',
                        stroke: '#000',
                        'stroke-width': 1
                    },
                    '.uml-class-methods-text': {
                        fill: '#ccc',
                        'font-size': 11
                    }
                }

            });

            classMap[cls.className] = classBox;
            graph.addCell(classBox);

            col++;
            if (col % 3 === 0) {
                col = 0;
                row++;
            }
        });
      
        // Draw relationships (associations)
        classes.forEach(cls => {
            const source = classMap[cls.className];
            (cls.references || []).forEach(ref => {
                const target = classMap[ref.type];
                if (target) {
                    const link = new uml.Association({
                        source: { id: source.id },
                        target: { id: target.id },
                        labels: [
                            {
                                position: 0.5,
                                attrs: {
                                    text: { text: ref.name, 'font-size': 10, fill: '#333' }
                                }
                            },
                            {
                                position: 0.95,
                                attrs: {
                                    text: { text: ref.multiplicity || '', 'font-size': 9, fill: '#666' }
                                }
                            }
                        ]
                    });
                    graph.addCell(link);
                    
                }
            });
        });     
    } 
    
    
   //--- 
    function highlightElementOnCanvas(className) {
        const cell = graph.getCells().find(c => c.attributes.type === 'uml.Class' && c.attributes.name === className);
        if (cell) {
            // Remove previous highlights
            graph.getCells().forEach(c => {
                if (c.attributes.type === 'uml.Class') {
                    c.attr('.uml-class-name-rect/stroke', '#000');
                    c.attr('.uml-class-name-rect/stroke-width', 1);
                }
            });

            // Highlight selected class
            cell.attr('.uml-class-name-rect/stroke', '#ff6600');
            cell.attr('.uml-class-name-rect/stroke-width', 3);
        }
    }
 
    paper.on('element:pointerclick', (elementView) => {
        const className = elementView.model.attributes.name;
        const attributes = elementView.model.attributes.attributes || [];
        
        const attrList = attributes.length
            ? attributes.map(a => `• ${a}`).join('\n')
            : 'No attributes defined.';

        alert(`Class: ${className}\n\nAttributes:\n${attrList}`);
    });
//---
    
	let jsonEditor = null;

	function openJsonInstancePanel(cls) {
	    const pkg = document.getElementById("packageSelect").value;
	    if (!pkg) return alert("Please select a package first.");

	    const base = { eClass: cls.className };
	    (cls.attributes || []).forEach(attr => {
	        base[attr.name] = "";
	    });

	    document.getElementById("jsonTargetClass").textContent = cls.className;
	    document.getElementById("jsonModelFile").value = `${pkg}.xmi`;
	    document.getElementById("jsonInstancePanel").style.display = 'block';

	    const json = JSON.stringify(base, null, 2);

	    // Initialize or update CodeMirror
	    if (!jsonEditor) {
	        jsonEditor = CodeMirror(document.getElementById("jsonEditor"), {
	            value: json,
	            mode: "application/json",
	            lineNumbers: true,
	            theme: "material",
	            tabSize: 2,
	        });
	    } else {
	        jsonEditor.setValue(json);
	    }
	}



	
	function submitJsonInstance() {
	    const pkg = document.getElementById("packageSelect").value.trim();
	    const file = document.getElementById("jsonModelFile").value.trim() || `${pkg}.xmi`;

	    let jsonText = jsonEditor ? jsonEditor.getValue() : document.getElementById("jsonInstanceInput").value.trim();

	    let data;
	    try {
	        data = JSON.parse(jsonText);
	    } catch (err) {
	        alert("Invalid JSON format.");
	        return;
	    }

	    const className = data.eClass;
	    if (!className) {
	        alert("Missing 'eClass' property in JSON.");
	        return;
	    }

	    delete data.eClass;
	    const query = new URLSearchParams(data).toString();
	    const url = `/${pkg}/${className}/create?${query}&modelFileName=${file}`;

	    fetch(url, { method: 'POST' })
	        .then(res => {
	            if (!res.ok) throw new Error("Failed to create instance.");
	            alert("Instance created successfully.");
	            document.getElementById("jsonInstancePanel").style.display = "none";
	        })
	        .catch(err => {
	            alert("Error: " + err.message);
	            console.error(err);
	        });
	}

	 window.submitJsonInstance = submitJsonInstance;
	 
//End Json
    
 /**
 Show instances for class
 */
	 function showInstancesForClass(className) {
		    const pkg = document.getElementById("packageSelect").value;
		    if (!pkg || !className) return;
	
		    fetch(`/api/v1/models/${pkg}/${className}/instances/all`)
		        .then(res => {
		            if (!res.ok) throw new Error("Failed to fetch instances");
		            return res.json();
		        })
		        .then(instances => {
		            document.getElementById("instancePanelTitle").textContent = className;
	
		            if (!instances || instances.length === 0) {
		                document.getElementById("instanceList").textContent = "No instances found.";
		                return;
		            }
		            instanceEditor.setValue(JSON.stringify(instances, null, 2));
		            //document.getElementById("instanceList").textContent = JSON.stringify(instances, null, 2);
		        })
		        .catch(err => {
		            console.error("Error fetching instances:", err);
		            document.getElementById("instanceList").textContent = "Error loading instances.";
		        });
		}

    
    
    function loadPackage() {
        const pkg = document.getElementById("packageSelect").value.trim();
        if (!pkg) {
            alert("Please select a package.");
            return;
        }

        fetchClasses(pkg).then(classes => {
            renderClassList(classes);
            drawGraph(classes);
            fetchAndRenderSummary(pkg); // 👈 Model summary
        }).catch(err => {
            alert("Failed to load package: " + pkg);
            console.error(err);
        });
    }

    window.loadPackage = loadPackage;
	
    function populatePackageDropdown() {
    	 console.log("Calling fetch for /metamodels/epackages");
        fetch('/api/v1/metamodels')
            .then(res => res.json())
            .then(pkgs => {
                console.log("Received packages:", pkgs); // 👈 LOG RESPONSE

                const select = document.getElementById("packageSelect");
                select.innerHTML = '<option value="">Select a package...</option>';

                pkgs.forEach(pkg => {
                    const opt = document.createElement("option");
                    opt.value = pkg.name;
                    opt.textContent = pkg.name;
                    select.appendChild(opt);
                });
            })
            .catch(err => {
                console.error("Failed to load packages:", err); // 👈 LOG ERROR
            });
    }

/*
	// Attach hover behavior
	paper.on('link:mouseenter', (linkView) => {
	    const tools = new joint.dia.ToolsView({
	        tools: [customRemoveTool]
	    });
	    linkView.addTools(tools);
	});
	
	*/
	paper.on('link:mouseleave', (linkView) => {
	    linkView.removeTools();
	});
	
	
	

	/**
	*Summary Total number of classes, attributes, references, etc
	*/
	function fetchAndRenderSummary(pkg) {
	    if (!pkg) return;

	    fetch(`/api/v1/metamodels/${encodeURIComponent(pkg)}/summary`)
	        .then(res => {
	            if (!res.ok) throw new Error("Failed to fetch summary");
	            return res.json();
	        })
	        .then(summary => {
			    document.getElementById("summaryClasses").textContent = summary.classes ?? 0;
			    document.getElementById("summaryAttributes").textContent = summary.attributes ?? 0;
			    document.getElementById("summaryReferences").textContent = summary.references ?? 0;
			})

	        .catch(err => {
	            console.error("Summary fetch error:", err);
	            document.getElementById("summaryClasses").textContent = "-";
	            document.getElementById("summaryAttributes").textContent = "-";
	            document.getElementById("summaryReferences").textContent = "-";
	        });
	}
	
	 //window.fetchAndRenderSummary = fetchAndRenderSummary;

    
    /**
     * Zoom in/out using mouse wheel
     */
    let zoomLevel = 1;
    const zoomMin = 0.2;
    const zoomMax = 2;
    const zoomStep = 0.1;

    document.getElementById('graph').addEventListener('wheel', (evt) => {
        evt.preventDefault();
        const delta = evt.deltaY;

        if (delta < 0 && zoomLevel < zoomMax) {
            zoomLevel = Math.min(zoomLevel + zoomStep, zoomMax);
        } else if (delta > 0 && zoomLevel > zoomMin) {
            zoomLevel = Math.max(zoomLevel - zoomStep, zoomMin);
        }

        paper.scale(zoomLevel);
    }, { passive: false });
};

</script>

</body>
</html>
